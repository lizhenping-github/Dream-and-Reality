<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>小组件设置</title>
  <style>
    /* ===== 设置窗口样式 ===== */
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      font-family: 'Microsoft YaHei UI', 'PingFang SC', system-ui, sans-serif;
      background: #f4f5f9;
      color: #2b2b2b;
      user-select: none;
    }
    body { display: flex; flex-direction: column; }

    /* 自定义标题栏（可拖动窗口） */
    #bar {
      -webkit-app-region: drag;
      height: 46px;
      flex: none;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-weight: 600;
      position: relative;
      background: #fff;
      border-bottom: 1px solid #ececf1;
    }
    #closeBtn {
      -webkit-app-region: no-drag;
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      width: 28px;
      height: 28px;
      border: none;
      border-radius: 8px;
      background: transparent;
      font-size: 14px;
      color: #888;
      cursor: pointer;
    }
    #closeBtn:hover { background: #f0f0f4; color: #333; }

    /* 表单区域 */
    #form {
      flex: 1;
      overflow-y: auto;
      padding: 18px 26px 24px;
    }
    .row {
      display: flex;
      align-items: flex-start;
      margin-bottom: 18px;
    }
    .row > label {
      width: 76px;
      flex: none;
      font-size: 13px;
      color: #555;
      line-height: 34px;
    }
    .ctrl { flex: 1; min-width: 0; }

    input[type="text"], input[type="number"], select, input[type="time"] {
      height: 34px;
      border: 1px solid #e2e2ea;
      border-radius: 10px;
      background: #fff;
      padding: 0 10px;
      font-size: 13px;
      outline: none;
      color: #2b2b2b;
    }
    input:focus, select:focus { border-color: #8b8bff; }
    input[type="text"] { width: 100%; }

    /* 工作日胶囊 */
    .chips { display: flex; flex-wrap: wrap; gap: 8px; }
    .chip {
      padding: 7px 14px;
      border-radius: 10px;
      border: 1px solid #e2e2ea;
      background: #fff;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.12s;
    }
    .chip.on {
      background: #111;
      color: #fff;
      border-color: #111;
      font-weight: 600;
    }

    /* 颜色色板 */
    .swatches { display: flex; flex-wrap: wrap; gap: 9px; align-items: center; }
    .sw {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      border: 1px solid rgba(0,0,0,0.12);
      cursor: pointer;
      position: relative;
    }
    .sw.on::after {
      content: '✓';
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      color: #fff;
      text-shadow: 0 0 3px rgba(0,0,0,0.7);
    }
    .colorInput {
      width: 34px;
      height: 28px;
      border: 1px solid #e2e2ea;
      border-radius: 8px;
      background: #fff;
      padding: 1px;
      cursor: pointer;
    }
    .hint { font-size: 12px; color: #999; margin-left: 6px; }

    /* 宠物形象选择 */
    .pets { display: flex; flex-wrap: wrap; gap: 12px; }
    .pet-item {
      width: 76px;
      height: 76px;
      border-radius: 14px;
      overflow: hidden;
      border: 2px solid transparent;
      cursor: pointer;
      position: relative;
      background: #fff;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .pet-item img { width: 100%; height: 100%; object-fit: cover; }
    .pet-item.on { border-color: #111; }
    .pet-item.on::after {
      content: '✓';
      position: absolute;
      top: 4px;
      right: 4px;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #111;
      color: #fff;
      font-size: 11px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .pet-item.custom {
      border: 2px dashed #c9c9d4;
      box-shadow: none;
      flex-direction: column;
      gap: 3px;
      font-size: 11px;
      color: #888;
    }
    .pet-item.custom img { width: 100%; height: 100%; object-fit: contain; background: #fafafa; }
    .pet-item.custom .plus { font-size: 20px; color: #aaa; }
    .pet-item.custom .txt { line-height: 1.1; text-align: center; padding: 0 4px; }

    /* 复选框行 */
    .checks { display: flex; flex-direction: column; gap: 12px; padding-top: 6px; }
    .checks label { display: flex; align-items: center; gap: 8px; font-size: 13px; color: #444; cursor: pointer; }
    .checks input { width: 16px; height: 16px; accent-color: #111; cursor: pointer; }

    /* 保存按钮 */
    #saveBtn {
      display: block;
      margin: 26px auto 6px;
      width: 200px;
      height: 42px;
      border: none;
      border-radius: 999px;
      background: #111;
      color: #fff;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      letter-spacing: 2px;
    }
    #saveBtn:hover { background: #2b2b2b; }

    .inline { display: flex; align-items: center; gap: 8px; }
  </style>
</head>
<body>
  <!-- 标题栏 -->
  <div id="bar">
    <span>小组件设置</span>
    <button id="closeBtn">✕</button>
  </div>

  <!-- 表单 -->
  <div id="form">
    <div class="row">
      <label>组件名称</label>
      <div class="ctrl"><input type="text" id="widgetName" maxlength="20" /></div>
    </div>

    <div class="row">
      <label>工作日</label>
      <div class="ctrl chips" id="workdays"></div>
    </div>

    <div class="row">
      <label>工作时间</label>
      <div class="ctrl inline">
        <input type="time" id="workStart" /> <span class="hint">至</span> <input type="time" id="workEnd" />
      </div>
    </div>

    <div class="row">
      <label>字体颜色</label>
      <div class="ctrl swatches" id="fontColors"></div>
    </div>

    <div class="row">
      <label>背景颜色</label>
      <div class="ctrl swatches" id="bgColors"></div>
    </div>

    <div class="row">
      <label>发薪日</label>
      <div class="ctrl inline">
        <select id="payday"></select>
      </div>
    </div>

    <div class="row">
      <label>每日收入</label>
      <div class="ctrl inline">
        <input type="number" id="dailyIncome" min="0" step="50" style="width:110px" /> <span class="hint">元</span>
      </div>
    </div>

    <div class="row">
      <label>宠物形象</label>
      <div class="ctrl pets" id="petList"></div>
    </div>

    <div class="row">
      <label>宠物名称</label>
      <div class="ctrl"><input type="text" id="petName" maxlength="10" /></div>
    </div>

    <div class="row">
      <label>其他</label>
      <div class="ctrl checks">
        <label><input type="checkbox" id="pinDesktop" /> 嵌入桌面层（像壁纸一样钉在桌面，不遮挡其他窗口）</label>
        <label><input type="checkbox" id="bubbleEnabled" /> 开启宠物气泡语录</label>
        <label><input type="checkbox" id="autoStart" /> 开机自启</label>
        <label><input type="checkbox" id="clickThrough" /> 鼠标穿透（锁定位置，托盘可取消）</label>
      </div>
    </div>

    <button id="saveBtn">保存完成</button>
  </div>

  <script src="settings.js"></script>
</body>
</html>
